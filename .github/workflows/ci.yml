name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  d2l-extension:
    name: D2L extension (mocked, windows)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: node --test apps/d2l-extension/test/*.test.js

  deployment-scripts:
    name: deployment scripts (windows)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: node --test scripts/test/deploy.test.mjs
      - run: node --test scripts/test/check-state.test.mjs

  # Proves mutation.yml's verdict step really fails on a bad sweep. That
  # workflow is dispatch-only, so this self-test runs the same verdict script
  # over synthetic SURVIVED / NOT APPLIED / INVALID reports here, in the PR's
  # normal CI, and proves the exit-code capture shape the workflow uses.
  mutation-verdict-selftest:
    name: mutation verdict self-test (windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Prove a bad sweep fails and a clean sweep passes
        shell: pwsh
        run: pwsh -NoProfile -File reviewer-tools/test/verdict-selftest.ps1

  # Cloud gateway, contracts and acceptance. These run under the Cloudflare
  # Workers pool, so they are platform-independent and live on Linux.
  workspace:
    name: workspace suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # The watchdog is a separate Worker on purpose -- the failure that kills the
  # gateway must not kill the thing meant to report it -- so it has its own
  # wrangler.toml and its own vitest config. The root `pnpm test` uses a
  # single Workers pool pinned to the gateway's config and cannot run it, and
  # registering it there would recouple the two: a change to the gateway's
  # test bindings would break the watchdog's suite, which is the exact
  # coupling the app exists to avoid.
  watchdog:
    name: watchdog suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:watchdog

  # apps/hermes-runtime cannot run under the Workers pool, so `pnpm test`
  # never covered it. It MUST run on Windows: this package pins byte-exact
  # canonical files, and a .gitattributes gap silently rewrote them to CRLF
  # on checkout, breaking attestation on the only platform it targets. A
  # Linux-only job would have stayed green through that entire failure.
  hermes-runtime:
    name: hermes-runtime suite (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      # The attestation tests resolve the interpreter the source lock pins,
      # through the Windows launcher as `py -V:Astral/CPython3.11.16`. That
      # tag is a uv-managed install registered under PEP 514; a setup-python
      # interpreter is not registered and the launcher reports "No suitable
      # Python runtime found".
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.7"
      - run: uv python install 3.11.16
      - name: The pinned interpreter is resolvable through the launcher
        shell: pwsh
        run: py -V:Astral/CPython3.11.16 -c "import sys; print(sys.version)"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # temp-path.test.mjs stays here so PR CI exercises the Windows temp fix.
      - run: >-
          pnpm --filter @jarvis/hermes-runtime exec vitest run test
          --exclude test/source-lock.test.mjs
          --exclude test/workflow-containment-review5.test.mjs

  # The Windows local agent. Runs on both platforms deliberately: it targets
  # Windows, but the POSIX permission assertions on the device key file are
  # only meaningful on Linux, where st_mode actually reflects the mode.
  local-agent:
    name: local-agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.7"
      - run: uv sync --locked
        working-directory: apps/local-agent
      - run: uv run ruff check .
        working-directory: apps/local-agent
      # The application targets Windows even when portable tests run on Linux.
      - run: uv run mypy --platform win32 jarvis_local
        working-directory: apps/local-agent
      - run: uv run pytest -q
        working-directory: apps/local-agent
      # Cross-runtime redaction parity: Python's projection decisions against the
      # gateway's owner and external readers. It lived outside CI once and went
      # red unnoticed when the default reader flipped to external (PR #197).
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: uv run python tests/memory/redaction_differential.py --output "${{ runner.temp }}/redaction-python.json"
        working-directory: apps/local-agent
      - run: node scripts/check-redaction-differential.mjs --python-results "${{ runner.temp }}/redaction-python.json"

  # Fails if a byte-exact file would change on checkout. Catches the CRLF
  # class of bug directly rather than waiting for a downstream test to
  # notice, and reports every offender at once.
  line-endings:
    name: byte-exact files unchanged by checkout
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Compare on-disk bytes to the committed blob. Do NOT just grep for CR:
      # some -text files (e.g. licenses/CPython-LICENSE) legitimately contain
      # CRLF upstream, and -text exists precisely to preserve those bytes.
      # The real invariant is that checkout changed nothing.
      - name: Assert -text files match their committed blob
        shell: bash
        run: |
          status=0
          for f in $(git ls-files); do
            attr=$(git check-attr text -- "$f" | sed 's/.*text: //')
            [ "$attr" = "unset" ] || continue
            blob=$(git show "HEAD:$f" | sha256sum | cut -d' ' -f1)
            disk=$(sha256sum "$f" | cut -d' ' -f1)
            if [ "$blob" != "$disk" ]; then
              echo "::error file=$f::marked -text but checkout altered its bytes"
              status=1
            fi
          done
          exit $status

  state-carriers:
    name: state carriers are honest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      # The carriers are the only thing a fresh session reads to learn where the
      # project stands, and a stale one walked the owner through an impossible
      # setup twice. Broken evidence fails; stale or unconfirmed evidence gets
      # a visible warning. Run the checker fixtures here as well as on Windows
      # so platform-dependent path behavior cannot hide behind a green job.
      - run: node --test scripts/test/check-state.test.mjs
      - name: node scripts/check-state.mjs
        run: node scripts/check-state.mjs
