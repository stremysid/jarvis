[project]
name = "jarvis-local-agent"
version = "0.1.0"
description = "Jarvis Windows local agent: archive, distilled memory, and diagnostics"
# The Obsidian memory implementation plan pins this range; the reference
# machine runs 3.14.x. Deliberately wider than brain-bridge's 3.11 pin, which
# exists only to match the Hermes runtime.
requires-python = ">=3.12,<3.15"
dependencies = [
  "cryptography==46.0.3",
  "rfc8785==0.1.4",
]

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.15.10",
]

[build-system]
requires = ["uv-build==0.12.7"]
build-backend = "uv_build"

# The plan fixes the import path as `jarvis_local` at the package root rather
# than the backend's default `src/jarvis_local_agent`. Point the backend at
# the planned layout instead of renaming every documented module path.
[tool.uv.build-backend]
module-name = "jarvis_local"
module-root = ""

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["ANN", "B", "C4", "E", "F", "I", "N", "PIE", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN401", "S101"]
