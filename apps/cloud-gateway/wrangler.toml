name = "jarvis-cloud-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-22"

[secrets]
required = ["PIN_VERIFIER_JSON"]

[exports.CallSession]
type = "durable-object"
storage = "sqlite"

# Four cadences.
#
# The frequent tick drains work that is already owed -- queued deliveries,
# decision expiry -- and must stay cheap enough to run every five minutes
# forever. Polling is hourly because a repository's status documents do not
# change faster than that, and the plan is explicit that a hardened school
# tenant should see a sane cadence rather than continuous requests.
#
# The last two are each a PAIR of UTC hours an hour apart, and that is
# deliberate. Cloudflare crons fire on UTC with no notion of a timezone, so a
# single fixed hour lands on two different local hours across the year and the
# morning digest would arrive at 07:30 in July and 06:30 in November. Firing
# twice lets exactly one of the two match the target local hour; the router
# discards the other. Which one matches changes at the daylight-saving
# boundary, and neither the cron nor the router needs to know when that is.
#
# The list must match ROUTED_CRONS in src/scheduler/cron-router.ts. A cron
# here that the router does not recognise runs nothing, deliberately: a
# trigger added to one and not the other is a mistake, and running the wrong
# job is a worse way to discover it than running none.
[triggers]
crons = ["*/5 * * * *", "0 * * * *", "30 11,12 * * *", "30 23,0 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "jarvis"
database_id = "3239834d-ef6c-4853-86b8-31ea74037c8a"
migrations_dir = "src/persistence/migrations"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "jarvis-archive"

[[durable_objects.bindings]]
name = "CALL_SESSION"
class_name = "CallSession"

[env.test]

[env.test.secrets]
required = ["PIN_VERIFIER_JSON"]

[[env.test.d1_databases]]
binding = "DB"
database_name = "jarvis_test"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "src/persistence/migrations"

[[env.test.r2_buckets]]
binding = "ARCHIVE"
bucket_name = "jarvis-archive-test"

[[env.test.durable_objects.bindings]]
name = "CALL_SESSION"
class_name = "CallSession"
