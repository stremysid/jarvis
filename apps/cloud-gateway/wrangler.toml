name = "jarvis-cloud-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-22"

[secrets]
required = ["PIN_VERIFIER_JSON"]

[exports.CallSession]
type = "durable-object"
storage = "sqlite"

# Three cadences, not one.
#
# The frequent tick drains work that is already owed -- queued deliveries,
# decision expiry -- and must stay cheap enough to run every five minutes
# forever. Polling is hourly because a repository's status documents do not
# change faster than that and the plan is explicit that a hardened school
# tenant should see a sane cadence rather than continuous requests. The digest
# is once daily, at the hour the owner actually reads it.
#
# Times are UTC. 11:30 UTC is 07:30 Eastern in daylight time, which is the
# boot time the plan fixes the morning rhythm to. It drifts an hour in winter,
# which is the cost of Cloudflare crons having no timezone -- the handler
# corrects for it rather than the schedule.
[triggers]
crons = ["*/5 * * * *", "0 * * * *", "30 11 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "jarvis"
database_id = "3239834d-ef6c-4853-86b8-31ea74037c8a"
migrations_dir = "src/persistence/migrations"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "jarvis-archive"

[[durable_objects.bindings]]
name = "CALL_SESSION"
class_name = "CallSession"

[env.test]

[env.test.secrets]
required = ["PIN_VERIFIER_JSON"]

[[env.test.d1_databases]]
binding = "DB"
database_name = "jarvis_test"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "src/persistence/migrations"

[[env.test.r2_buckets]]
binding = "ARCHIVE"
bucket_name = "jarvis-archive-test"

[[env.test.durable_objects.bindings]]
name = "CALL_SESSION"
class_name = "CallSession"
